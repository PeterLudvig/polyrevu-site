<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyRevu</title>
<meta name="description" content="PolyRevu reads what people have publicly written about places to eat and drink, and scores them transparently. Coming soon.">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#242f3e;color:#f6f3ff;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.stage{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
.art{position:absolute;inset:0;width:100%;height:100%}
header,main,footer{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.brand{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;font-size:1.3rem;letter-spacing:-.01em;color:#f6f3ff;background:rgba(11,7,22,.82);padding:6px 16px;border-radius:999px;border:1px solid rgba(247,223,214,.18)}
nav a{font-size:.95rem;font-weight:600;color:#f6f3ff;text-decoration:none;background:rgba(11,7,22,.82);padding:8px 18px;border-radius:999px;border:1px solid rgba(247,223,214,.18)}
nav a:hover,nav a:focus-visible{color:#f2b14c;border-color:rgba(242,177,76,.5)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
/* On wide screens the box is part of the map drawing, so it stays centred on the park at every size.
   On tall narrow screens the map is cropped at the sides, so an ordinary centred box is shown instead. */
.panel{display:none;background:rgba(11,7,22,.88);border:1px solid rgba(242,177,76,.28);border-radius:22px;padding:32px 26px;text-align:center;max-width:22rem;box-shadow:0 18px 60px rgba(5,3,12,.6)}
.panel h1{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;font-size:3rem;line-height:1;letter-spacing:-.025em;margin:0 0 14px}
.panel p{margin:0;color:rgba(246,243,255,.82)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-aspect-ratio:1/1){.panel{display:block}.svgpanel{display:none}.sr{display:none}}
footer{padding:14px 20px;font-size:.8rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer span,footer a{background:rgba(11,7,22,.78);padding:3px 12px;border-radius:999px;color:rgba(246,243,255,.78)}
.num{font:700 9.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1c1917;text-anchor:middle;dominant-baseline:central}
.cs{font:600 70px Fraunces,Georgia,"Times New Roman",serif;fill:#f6f3ff;text-anchor:middle;letter-spacing:-1.5px}
.cs2{font:400 21px "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgba(246,243,255,.82);text-anchor:middle}
@media (prefers-reduced-motion:no-preference){.pin{animation:drop .45s ease-out both}.pin:nth-of-type(2n){animation-delay:.1s}.pin:nth-of-type(3n){animation-delay:.2s}}
@keyframes drop{from{opacity:0}to{opacity:1}}
</style>
</head>
